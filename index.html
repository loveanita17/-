<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務截圖排程格式化與整理工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
    <header class="bg-indigo-900 text-white px-6 py-5">
      <h1 class="text-2xl font-bold tracking-wide">業務截圖排程格式化與整理工具</h1>
      <p class="text-indigo-200 text-sm mt-1">自動解析排程資料、日期篩選、格式轉換與 Word 檔匯出</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 p-6">
      <!-- 左側：輸入區 -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">貼上原始排程資料：</label>
          <textarea id="rawInput" rows="12" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="貼上原始資料..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">篩選開始日期：</label>
            <input type="date" id="startDate" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">篩選結束日期：</label>
            <input type="date" id="endDate" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
          </div>
        </div>

        <button onclick="processData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
          🚀 開始格式化與篩選
        </button>
      </div>

      <!-- 右側：結果與匯出 -->
      <div class="space-y-4 flex flex-col">
        <div class="flex justify-between items-center">
          <label class="block text-sm font-semibold text-slate-700">格式化結果預覽：</label>
          <div class="space-x-2">
            <button onclick="copyResult()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded transition">
              📋 複製全文
            </button>
            <button onclick="downloadWord()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded shadow transition">
              📥 下載 Word 檔 (.docx)
            </button>
          </div>
        </div>

        <div id="outputArea" class="flex-1 min-h-[300px] p-4 bg-slate-50 border border-slate-200 rounded-lg text-sm overflow-y-auto leading-relaxed font-sans">
          <p class="text-slate-400 italic">請在左側輸入資料並點擊「開始格式化與篩選」...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let dynamicFileName = "2026 業務截圖安排.docx";

    function parseDates(text) {
      const dates = [];
      const m = text.match(/(\d{1,2})[\/\-](\d{1,2})\s*[\~\-–—]\s*(?:(\d{1,2})[\/\-])?(\d{1,2})/);
      if (m) {
        const startM = parseInt(m[1]), startD = parseInt(m[2]);
        const endM = m[3] ? parseInt(m[3]) : startM;
        const endD = parseInt(m[4]);
        let cur = new Date(2026, startM - 1, startD);
        let end = new Date(2026, endM - 1, endD);
        while (cur <= end) {
          dates.push(`${cur.getMonth()+1}/${cur.getDate()}`);
          cur.setDate(cur.getDate() + 1);
        }
      } else {
        const single = text.match(/(\d{1,2})[\/\-](\d{1,2})/);
        if (single) {
          dates.push(`${parseInt(single[1])}/${parseInt(single[2])}`);
        }
      }
      return dates;
    }

    function processData() {
      try {
        const raw = document.getElementById('rawInput').value;
        const startInput = document.getElementById('startDate').value;
        const endInput = document.getElementById('endDate').value;
        
        if (!raw || !raw.trim()) {
          alert('請輸入原始排程資料！');
          return;
        }

        let targetDates = [];
        if (startInput && endInput) {
          let cur = new Date(startInput);
          let end = new Date(endInput);
          while (cur <= end) {
            targetDates.push(`${cur.getMonth()+1}/${cur.getDate()}`);
            cur.setDate(cur.getDate() + 1);
          }
          
          const sM = String(new Date(startInput).getMonth() + 1).padStart(2, '0');
          const sD = String(new Date(startInput).getDate()).padStart(2, '0');
          const eM = String(new Date(endInput).getMonth() + 1).padStart(2, '0');
          const eD = String(new Date(endInput).getDate()).padStart(2, '0');
          dynamicFileName = `2026 業務截圖安排${sM}${sD}-${eM}${eD}.docx`;
        }

        const lines = raw.split('\n').filter(l => l.trim() !== '');
        const scheduleByDate = {};

        lines.forEach(line => {
          let clean = line.replace(/^[Vv\s✓✔✅\*\-\•]+/g, '').trim();
          if (!clean) return;

          const dates = parseDates(clean);
          if (dates.length === 0) return;

          // 核心規則替換
          clean = clean.replace(/【一般文字撰稿】/g, '新聞稿');
          clean = clean.replace(/MTOP1/g, '(M) 全網_TOP 推廣 1').replace(/MTOP2/g, '(M) 全網_TOP 推廣 2');
          clean = clean.replace(/(旅遊雲|新聞雲IG|即新聞FB|新聞雲APP)/g, '社群：$1');

          // 抓取 12 碼編號
          let codeMatch = clean.match(/(\d{12})/);
          let code = codeMatch ? codeMatch[1] : '';

          // 提取案名
          let titlePart = clean;
          if (code) {
            let idx = clean.indexOf(code);
            titlePart = clean.substring(idx + code.length).trim();
          }

          let titleSplits = titlePart.split('-');
          let projName = titleSplits[0].trim();
          if (code) projName = `${projName} (${code})` ;

          // 處理版位
          let subItems = [];
          let timePrefix = (clean.includes('09:00') || clean.includes('9點') || clean.includes('AM09:00')) ? '09:00起：' : '';

          if (clean.includes('AD、播吧、短影') || clean.includes('影音廣編AD')) {
            const is3 = clean.includes('(3)');
            subItems.push(`PC首頁&M內頁_短影${is3 ? ' (3組)' : ''}`);
            subItems.push(`PC+M-SITE新聞內頁_影音廣編AD${is3 ? ' (3組)' : ''}`);
            subItems.push(`PC+M-SITE播吧_精選影音${is3 ? ' (3組)' : ''}`);
          } else {
            let detail = titleSplits.length > 1 ? titleSplits.slice(1).join('-') : clean;
            detail = detail.replace(/-\d{1,2}\/\d{1,2}.*$/, '').replace(/走期[：:].*$/, '').trim();
            
            let chapterM = clean.match(/（(第.*?篇)）|\((第.*?篇)\)/);
            let chapter = chapterM ? ` (${chapterM[1] || chapterM[2]})` : '';

            let parts = detail.split(/[\s,、]+/);
            parts.forEach(p => {
              p = p.replace(/^[Vv\s\-\•]+/g, '').trim();
              if (p && !p.match(/^\d{1,2}\/\d{1,2}/) && !p.startsWith('AM')) {
                subItems.push((timePrefix ? timePrefix : '') + p + chapter);
              }
            });
          }

          if (subItems.length === 0) {
            subItems.push(clean);
          }

          dates.forEach(d => {
            if (targetDates.length > 0 && !targetDates.includes(d)) return;
            if (!scheduleByDate[d]) scheduleByDate[d] = [];
            scheduleByDate[d].push({
              title: projName,
              items: subItems
            });
          });
        });

        // 產生預覽 HTML
        let html = `<h2 style="font-size: 16pt; font-weight: bold; margin-bottom: 12pt; font-family: Microsoft JhengHei, sans-serif;">2026 業務截圖安排</h2>`;

        const sortedDates = Object.keys(scheduleByDate).sort((a,b) => {
          const [mA, dA] = a.split('/').map(Number);
          const [mB, dB] = b.split('/').map(Number);
          return mA !== mB ? mA - mB : dA - dB;
        });

        if (sortedDates.length === 0) {
          html += `<p style="color: #64748b; font-style: italic;">查無符合指定日期區間的排程資料（請確認貼上的資料是否包含完整日期範圍）。</p>`;
        } else {
          sortedDates.forEach(date => {
            html += `<h3 style="font-size: 13pt; font-weight: bold; margin-top: 14pt; margin-bottom: 6pt; color: #1e3a8a; font-family: Microsoft JhengHei, sans-serif;">📅 ${date}</h3>`;
            
            scheduleByDate[date].forEach(proj => {
              html += `<div style="margin-bottom: 8pt; font-family: Microsoft JhengHei, sans-serif;">`;
              html += `<div style="font-weight: bold; font-size: 11pt; color: #0f172a;">${proj.title}</div>`;
              html += `<ul style="list-style-type: none; padding-left: 16px; margin-top: 2pt; margin-bottom: 4pt;">`;
              proj.items.forEach(sub => {
                html += `<li style="font-size: 10.5pt; color: #334155; margin-bottom: 2pt;">• ${sub}</li>`;
              });
              html += `</ul></div>`;
            });
          });
        }

        html += `<hr style="margin: 18pt 0; border: none; border-top: 1px solid #cbd5e1;"><div style="font-size: 10pt; color: #475569; line-height: 1.6; font-family: Microsoft JhengHei, sans-serif;">
          <strong>📌 相關資訊</strong><br>
          • 截圖雲端連結：<a href="https://drive.google.com/drive/u/0/folders/1qGNF_vLK64gP_MkxKR0Q8rX3P6BS6k6c" target="_blank">Google Drive 雲端</a><br>
          • 假日社群電話：02-55556366 #6322、6326<br>
          • 製作部聯繫窗口：<br>
              李宜蓁：0918-943-491<br>
              林思妤：0911-916-583<br>
              李玟儒：0921-970-375
        </div>`;

        document.getElementById('outputArea').innerHTML = html;
      } catch (err) {
        alert('解析發生例外錯誤：' + err.message);
        console.error(err);
      }
    }

    function copyResult() {
      const text = document.getElementById('outputArea').innerText;
      if (!text || text.includes('請在左側輸入')) {
        alert('目前沒有可複製的內容！');
        return;
      }
      navigator.clipboard.writeText(text).then(() => alert('已成功複製到剪貼簿！'));
    }

    function downloadWord() {
      const content = document.getElementById('outputArea').innerHTML;
      if (!content || content.includes('請在左側輸入')) {
        alert('請先點擊「開始格式化與篩選」產生內容後再下載！');
        return;
      }
      const converted = htmlDocx.asBlob(`<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${content}</body></html>`);
      saveAs(converted, dynamicFileName);
    }
  </script>
</body>
</html>
