<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務截圖排程格式化與整理工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
    <header class="bg-indigo-900 text-white px-6 py-5">
      <h1 class="text-2xl font-bold tracking-wide">業務截圖排程格式化與整理工具</h1>
      <p class="text-indigo-200 text-sm mt-1">自動解析排程資料、日期篩選、格式轉換與 Word 檔匯出</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 p-6">
      <!-- 左側：輸入區 -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">貼上原始排程資料：</label>
          <textarea id="rawInput" rows="12" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="貼上原始資料..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">篩選開始日期：</label>
            <input type="date" id="startDate" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">篩選結束日期：</label>
            <input type="date" id="endDate" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
          </div>
        </div>

        <button onclick="processData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
          🚀 開始格式化與篩選
        </button>
      </div>

      <!-- 右側：結果與匯出 -->
      <div class="space-y-4 flex flex-col">
        <div class="flex justify-between items-center">
          <label class="block text-sm font-semibold text-slate-700">格式化結果預覽：</label>
          <div class="space-x-2">
            <button onclick="copyResult()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded transition">
              📋 複製全文
            </button>
            <button onclick="downloadWord()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded shadow transition">
              📥 下載 Word 檔 (.docx)
            </button>
          </div>
        </div>

        <div id="outputArea" class="flex-1 min-h-[300px] p-4 bg-slate-50 border border-slate-200 rounded-lg text-sm overflow-y-auto leading-relaxed font-sans">
          <p class="text-slate-400 italic">請在左側輸入資料並點擊「開始格式化與篩選」...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let dynamicFileName = "2026 業務截圖安排.docx";

    function parseDateRange(text) {
      const dates = [];
      const m = text.match(/(\d{1,2})[\/\-](\d{1,2})\s*[\~\-–—]\s*(?:(\d{1,2})[\/\-])?(\d{1,2})/);
      if (m) {
        const startM = parseInt(m[1]), startD = parseInt(m[2]);
        const endM = m[3] ? parseInt(m[3]) : startM;
        const endD = parseInt(m[4]);
        let cur = new Date(2026, startM - 1, startD);
        const end = new Date(2026, endM - 1, endD);
        while (cur <= end) {
          dates.push(`${cur.getMonth()+1}/${cur.getDate()}`); cur.setDate(cur.getDate() + 1); } } else { const single = text.match(/(\d{1,2})[\/\-](\d{1,2})/); if (single) dates.push(`${parseInt(single[1])}/${parseInt(single[2])}`); } return dates; }  function processData() { try { const raw = document.getElementById('rawInput').value; const startInput = document.getElementById('startDate').value; const endInput = document.getElementById('endDate').value; if (!raw) return alert('請輸入原始排程資料！');  const lines = raw.split('\n').filter(l => l.trim() !== ''); let targetDates = [];  if (startInput && endInput) { let cur = new Date(startInput); let end = new Date(endInput); while (cur <= end) { targetDates.push(`${cur.getMonth()+1}/${cur.getDate()}`); cur.setDate(cur.getDate() + 1); }  const sM = String(new Date(startInput).getMonth() + 1).padStart(2, '0'); const sD = String(new Date(startInput).getDate()).padStart(2, '0'); const eM = String(new Date(endInput).getMonth() + 1).padStart(2, '0'); const eD = String(new Date(endInput).getDate()).padStart(2, '0'); dynamicFileName = `2026 業務截圖安排${sM}${sD}-${eM}${eD}.docx`; }  const scheduleByDate = {};  lines.forEach(line => { let cleanLine = line.replace(/^[Vv\s✓✔✅\*\-\•]+/g, '').trim(); const dates = parseDateRange(cleanLine);  cleanLine = cleanLine.replace(/【一般文字撰稿】/g, '新聞稿'); cleanLine = cleanLine.replace(/MTOP1/g, '(M) 全網_TOP 推廣 1').replace(/MTOP2/g, '(M) 全網_TOP 推廣 2');  let projName = ""; let projCode = ""; const codeMatch = cleanLine.match(/(\d{12})/); if (codeMatch) projCode = codeMatch[1];  let mainTitleMatch = cleanLine.match(/(?:^\d{12}\s+)?([^(?:\n-]+)/); projName = mainTitleMatch ? mainTitleMatch[1].trim() : "專案項目"; projName = projName.replace(/^[Vv\s✓✔✅\*\-\•]+/g, '').trim(); if (projCode && !projName.includes(projCode)) { projName = `${projName} (${projCode})`; }  let subItems = []; let timePrefix = (cleanLine.includes('09:00') \vert{}\vert{} cleanLine.includes('9點') \vert{}\vert{} cleanLine.includes('AM09:00')) ? '09:00起：' : '';  if (cleanLine.includes('AD、播吧、短影') \vert{}\vert{} cleanLine.includes('影音廣編AD')) { const is3 = cleanLine.includes('(3)'); subItems.push(`PC首頁&M內頁_短影${is3 ? ' (3組)' : ''}`);
            subItems.push(`PC+M-SITE新聞內頁_影音廣編AD${is3 ? ' (3組)' : ''}`); subItems.push(`PC+M-SITE播吧_精選影音${is3 ? ' (3組)' : ''}`);
          } else {
            let subText = cleanLine;
            if (projCode) subText = subText.replace(projCode, '');
            subText = subText.replace(/走期[：:].*$/g, '').replace(/-\d{1,2}\/\d{1,2}.*$/g, '').trim();
            subText = subText.replace(/(旅遊雲|新聞雲IG|即新聞FB|新聞雲APP)/g, '社群：$1');
            
            subText = subText.replace(/^[Vv\s✓✔✅\*\-\•]+/g, '').trim();
            if (subText.startsWith('-')) subText = subText.substring(1).trim();
            if (!subText) subText = cleanLine;

            subItems.push((timePrefix && !subText.includes('09:00') ? timePrefix : '') + subText);
          }

          dates.forEach(d => {
            if (targetDates.length > 0 && !targetDates.includes(d)) return;
            if (!scheduleByDate[d]) scheduleByDate[d] = [];
            scheduleByDate[d].push({
              title: projName,
              items: subItems
            });
          });
        });

        let html = `<h2 style="font-size: 16pt; font-weight: bold; margin-bottom: 12pt; font-family: Microsoft JhengHei, sans-serif;">2026 業務截圖安排</h2>`;

        const sortedDates = Object.keys(scheduleByDate).sort((a,b) => {
          const [mA, dA] = a.split('/').map(Number);
          const [mB, dB] = b.split('/').map(Number);
          return mA !== mB ? mA - mB : dA - dB;
        });

        if (sortedDates.length === 0) {
          html += `<p style="color: #64748b; font-style: italic;">查無符合指定日期區間的排程資料。</p>`;
        }

        sortedDates.forEach(date => {
          html += `<h3 style="font-size: 13pt; font-weight: bold; margin-top: 14pt; margin-bottom: 6pt; color: #1e3a8a; font-family: Microsoft JhengHei, sans-serif;">📅 ${date}</h3>`;
          
          scheduleByDate[date].forEach(proj => {
            html += `<div style="margin-bottom: 8pt; font-family: Microsoft JhengHei, sans-serif;">`;
            html += `<div style="font-weight: bold; font-size: 11pt; color: #0f172a;">${proj.title}</div>`;
            html += `<ul style="list-style-type: none; padding-left: 16px; margin-top: 2pt; margin-bottom: 4pt;">`;
            proj.items.forEach(sub => {
              html += `<li style="font-size: 10.5pt; color: #3341
