<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務截圖排程格式化與整理工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
    <header class="bg-indigo-900 text-white px-6 py-5">
      <h1 class="text-2xl font-bold tracking-wide">業務截圖排程格式化與整理工具</h1>
      <p class="text-indigo-200 text-sm mt-1">自動解析排程資料、日期篩選、格式轉換與 Word 檔匯出</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 p-6">
      <!-- 左側：輸入區 -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">貼上原始排程資料：</label>
          <textarea id="rawInput" rows="12" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="貼上原始資料..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">篩選開始日期：</label>
            <input type="date" id="startDate" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">篩選結束日期：</label>
            <input type="date" id="endDate" class="w-full p-2 border border-slate-300 rounded-lg text-sm">
          </div>
        </div>

        <button onclick="processData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
          🚀 開始格式化與篩選
        </button>
      </div>

      <!-- 右側：結果與匯出 -->
      <div class="space-y-4 flex flex-col">
        <div class="flex justify-between items-center">
          <label class="block text-sm font-semibold text-slate-700">格式化結果預覽：</label>
          <div class="space-x-2">
            <button onclick="copyResult()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded transition">
              📋 複製全文
            </button>
            <button onclick="downloadWord()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded shadow transition">
              📥 下載 Word 檔 (.docx)
            </button>
          </div>
        </div>

        <div id="outputArea" class="flex-1 min-h-[300px] p-4 bg-slate-50 border border-slate-200 rounded-lg text-sm overflow-y-auto leading-relaxed font-sans">
          <p class="text-slate-400 italic">請在左側輸入資料並點擊「開始格式化與篩選」...</p>
        </div>
      </div>
    </div>
  </div>
